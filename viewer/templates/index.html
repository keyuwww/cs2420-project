<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emergent Unsafe Prompt Viewer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 16px;
        }

        .controls {
            padding: 30px;
            background: #f8f9fa;
            border-bottom: 1px solid #e0e0e0;
        }

        .dropdown-container {
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .dropdown-container label {
            font-weight: 600;
            color: #333;
        }

        select {
            flex: 1;
            min-width: 300px;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
        }

        select:hover {
            border-color: #667eea;
        }

        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .content {
            padding: 30px;
        }

        .loading {
            text-align: center;
            padding: 60px;
            color: #666;
            font-size: 18px;
        }

        .image-section {
            margin-bottom: 40px;
        }

        .image-container {
            text-align: center;
            margin-bottom: 30px;
        }

        .image-container img {
            max-width: 100%;
            max-height: 600px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .captions-section {
            margin-bottom: 40px;
        }

        .section-title {
            font-size: 24px;
            font-weight: 700;
            color: #333;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 3px solid #667eea;
        }

        .caption-card {
            background: #f8f9fa;
            border-left: 4px solid #667eea;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 4px;
        }

        .caption-label {
            font-weight: 600;
            color: #667eea;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
            margin-bottom: 8px;
        }

        .caption-text {
            color: #333;
            line-height: 1.6;
            font-size: 15px;
        }

        .prompts-section {
            display: grid;
            gap: 20px;
        }

        .prompt-card {
            background: white;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            padding: 20px;
            transition: all 0.3s;
        }

        .prompt-card:hover {
            border-color: #667eea;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }

        .prompt-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .prompt-level {
            font-weight: 700;
            color: #667eea;
            text-transform: uppercase;
            font-size: 14px;
            letter-spacing: 1px;
        }

        .prompt-meta {
            display: flex;
            gap: 10px;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .badge-tone {
            background: #e3f2fd;
            color: #1976d2;
        }

        .badge-severity {
            background: #ffebee;
            color: #c62828;
        }

        .badge-relation {
            background: #f3e5f5;
            color: #7b1fa2;
        }

        .prompt-caption {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
            color: #555;
            font-style: italic;
            border-left: 3px solid #ddd;
        }

        .prompt-text {
            font-size: 16px;
            line-height: 1.8;
            color: #333;
            font-weight: 500;
        }

        .error {
            background: #ffebee;
            color: #c62828;
            padding: 20px;
            border-radius: 8px;
            text-align: center;
        }

        .no-data {
            text-align: center;
            padding: 60px;
            color: #999;
        }

        @media (max-width: 768px) {
            .header h1 {
                font-size: 24px;
            }

            .dropdown-container {
                flex-direction: column;
                align-items: stretch;
            }

            select {
                min-width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Emergent Unsafe Prompt Viewer</h1>
            <p>Explore image captions and generated prompts at different detail levels</p>
        </div>

        <div class="controls">
            <div class="dropdown-container">
                <label for="imageSelect">Select Image:</label>
                <select id="imageSelect">
                    <option value="">Loading...</option>
                </select>
            </div>
        </div>

        <div class="content" id="content">
            <div class="loading">Loading data...</div>
        </div>
    </div>

    <script>
        let allData = [];

        // Load data on page load
        async function loadData() {
            try {
                const response = await fetch('/api/data');
                if (!response.ok) {
                    throw new Error('Failed to load data');
                }
                allData = await response.json();

                if (allData.length === 0) {
                    document.getElementById('content').innerHTML = '<div class="no-data">No data available. Please run the generation script first.</div>';
                    return;
                }

                populateDropdown();
                displayImage(0);
            } catch (error) {
                document.getElementById('content').innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }

        function populateDropdown() {
            const select = document.getElementById('imageSelect');
            select.innerHTML = '';

            allData.forEach((item, index) => {
                const option = document.createElement('option');
                option.value = index;
                const filename = item.image_path.split('/').pop();
                option.textContent = `${index + 1}. ${filename}`;
                select.appendChild(option);
            });

            select.addEventListener('change', (e) => {
                displayImage(parseInt(e.target.value));
            });
        }

        function displayImage(index) {
            const data = allData[index];
            if (!data) return;

            const filename = data.image_path.split('/').pop();
            const imageUrl = `/api/image/${filename}`;

            let html = `
                <div class="image-section">
                    <div class="image-container">
                        <img src="${imageUrl}" alt="Image ${index + 1}">
                    </div>
                </div>

                <div class="captions-section">
                    <h2 class="section-title">Generated Captions</h2>
                    <div class="caption-card">
                        <div class="caption-label">Brief</div>
                        <div class="caption-text">${data.captions.brief}</div>
                    </div>
                    <div class="caption-card">
                        <div class="caption-label">Detailed</div>
                        <div class="caption-text">${data.captions.detailed}</div>
                    </div>
                    <div class="caption-card">
                        <div class="caption-label">Comprehensive</div>
                        <div class="caption-text">${data.captions.comprehensive}</div>
                    </div>
                </div>

                <div class="prompts-section">
                    <h2 class="section-title">Emergent Unsafe Prompts</h2>
            `;

            if (data.results && data.results.length > 0) {
                data.results.forEach(result => {
                    html += `
                        <div class="prompt-card">
                            <div class="prompt-header">
                                <div class="prompt-level">${result.caption_level}</div>
                                <div class="prompt-meta">
                                    <span class="badge badge-tone">${result.meta.tone}</span>
                                    <span class="badge badge-severity">${result.meta.severity}</span>
                                    ${result.meta.relation ? `<span class="badge badge-relation">${result.meta.relation}</span>` : ''}
                                </div>
                            </div>
                            <div class="prompt-caption">
                                <strong>Caption used:</strong> ${result.caption_text}
                            </div>
                            <div class="prompt-text">
                                "${result.emergent_unsafe_prompt}"
                            </div>
                        </div>
                    `;
                });
            } else {
                html += '<div class="no-data">No prompts available for this image.</div>';
            }

            html += '</div>';

            document.getElementById('content').innerHTML = html;
        }

        // Initialize
        loadData();
    </script>
</body>
</html>
